# =============================================================================
# CellMap BioAnalytics — Render Blueprint Specification
# =============================================================================
# Deploy with one click via Render Dashboard > Blueprints > New Blueprint Instance
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

version: "1"

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + Uvicorn + Scientific Analysis Stack)
  # ---------------------------------------------------------------------------
  - type: web
    name: cellmap-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: APP_NAME
        value: "CellMap BioAnalytics"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://cellmap-frontend.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./cellmap.db"
      - key: CELERY_BROKER_URL
        value: "redis://localhost:6379/1"
      - key: CELERY_RESULT_BACKEND
        value: "redis://localhost:6379/2"
      - key: UPLOAD_DIR
        value: "data/uploads"
      - key: RESULTS_DIR
        value: "data/results"

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + TypeScript + Vite + Tailwind/Modern UI)
  # ---------------------------------------------------------------------------
  - type: web
    name: cellmap-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    autoDeploy: true
    routes:
      # Proxy /api requests to the backend service
      - type: rewrite
        source: /api/*
        destination: https://cellmap-backend.onrender.com/api/*
      # SPA fallback for client-side navigation
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://cellmap-backend.onrender.com"
